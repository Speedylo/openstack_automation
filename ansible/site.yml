---
- name: Terraform Playbook
  hosts: all
  become: true

  tasks:
    - name: Configure local apt proxy mirror caching layer
      ansible.builtin.copy:
        content: 'Acquire::http::Proxy "http://172.24.4.1:3142";'
        dest: /etc/apt/apt.conf.d/01proxy
        mode: '0644'

    - name: Ensure loopback hostname is cleanly mapped in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s+localhost'
        line: '127.0.0.1 webserver'
        state: present

    - name: Install updates
      apt:
        upgrade: dist
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: latest
